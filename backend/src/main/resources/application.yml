server:
  port: ${PORT:8080}

spring:
  application:
    name: sri-anjaneya-store
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sri_anjaneya_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Cloudinary Integration for Cross-Device Shared Image CDN
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Security & JWT Configuration
jwt:
  secret: ${JWT_SECRET:sriAnjaneyaFertilizersSecureKey2026AgriculturalShopTelanganaIndia1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days

# Initial Admin Bootstrap
admin:
  default:
    username: ${ADMIN_INITIAL_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:adminPassword123!}

# Shop Information
shop:
  name: "SRI ANJANEYA FERTILIZERS, PESTICIDES & SEEDS"
  whatsapp: ${SHOP_WHATSAPP_NUMBER:917095891270}
  phone: ${SHOP_PHONE_NUMBER:917095891270}
  location: "Main Road, Telangana, India"

# Allowed CORS Origins (comma-separated or list)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}
