services:
  - type: web
    name: sri-anjaneya-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: CORS_ALLOWED_ORIGINS
        value: https://sri-anjaneya-fertilizers-pesticides.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_USERNAME
        value: admin
      - key: ADMIN_DEFAULT_PASSWORD
        value: adminPassword123!
